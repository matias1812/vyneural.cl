plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // FCM real (P6 — recordatorios que llegan aunque el proceso de la app
    // esté muerto, no solo pausado/segundo plano; ver VyneuralMessagingService.kt
    // y REGLA DE ORO: el push SOLO prepara/muestra la notificación, JAMÁS
    // arranca audio por su cuenta). Requiere google-services.json en app/ —
    // ver comentario en el build.gradle raíz.
    id 'com.google.gms.google-services'
}

// Credenciales de firma RELEASE: nunca en el repo. Se leen de local.properties
// (gitignored) o de variables de entorno (CI). El keystore vive fuera del
// repositorio (p. ej. ~/.local/bineural-release.keystore).
def ksProps = new Properties()
def ksFile = rootProject.file('local.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }
def ksStore = ksProps.getProperty('bineural.storeFile', System.getenv('BINEURAL_STORE_FILE') ?: '')
def ksPass = ksProps.getProperty('bineural.storePassword', System.getenv('BINEURAL_STORE_PASS') ?: '')
def ksAlias = ksProps.getProperty('bineural.keyAlias', System.getenv('BINEURAL_KEY_ALIAS') ?: 'bineural')
def ksKeyPass = ksProps.getProperty('bineural.keyPassword', System.getenv('BINEURAL_KEY_PASS') ?: '')

android {
    namespace 'com.vyneural.bineural'
    compileSdk 36

    defaultConfig {
        applicationId "com.vyneural.bineural"
        minSdk 26
        targetSdk 36
        versionCode 52
        versionName "1.8.10"
        // Backend al que el worker de sincronización en segundo plano consulta
        // alarmas y reporta el dispositivo. Se puede sobrescribir en builds de
        // prueba: ./gradlew assembleRelease -PapiBase=http://10.0.2.2:8000
        def apiBase = project.hasProperty('apiBase') ? project.property('apiBase') : "https://vyneural-backend.onrender.com"
        buildConfigField "String", "API_BASE", "\"${apiBase}\""
    }

    // AGP 8 desactiva BuildConfig por defecto; el bridge lo usa para VERSION_NAME.
    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (ksStore && ksPass && ksKeyPass) {
                storeFile file(ksStore)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Firma RELEASE real (requiere credenciales en local.properties/env).
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    // La web (build de Vite en ../dist) va dentro de assets/bineural para que
    // la APK funcione OFFLINE. Refrescar así:
    //   npm run build && rm -rf app/src/main/assets/bineural && cp -r ../dist app/src/main/assets/bineural
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    // AuthStore.kt: tokens (access+refresh) cifrados con una clave respaldada
    // por el Android Keystore, en vez de SharedPreferences en texto plano.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // Google Play Billing (plan Premium, SOLO APK — ver billing/PlayBillingManager.kt).
    implementation 'com.android.billingclient:billing-ktx:8.0.0'
    // BoM fija versiones compatibles entre sí de todas las libs de Firebase.
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging-ktx'
}
